version: 2

updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "05:20"
          timezone: America/Los_Angeles
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
      groups:
          npm-minor-and-patch:
              patterns: ["*"]
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "05:50"
          timezone: America/Los_Angeles
      open-pull-requests-limit: 5
